name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export RUblocks for Windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest stable Godot and Windows export templates
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request
          import zipfile
          import shutil

          api = "https://api.github.com/repos/godotengine/godot/releases/latest"
          req = urllib.request.Request(api, headers={"Accept": "application/vnd.github+json", "User-Agent": "RUblocks-build"})
          with urllib.request.urlopen(req, timeout=30) as response:
              release = json.load(response)

          assets = release.get("assets", [])
          linux_asset = next((a for a in assets if a["name"].endswith("_linux.x86_64.zip")), None)
          template_asset = next((a for a in assets if a["name"].endswith("_export_templates.tpz")), None)
          if linux_asset is None or template_asset is None:
              raise SystemExit("Could not find the stable Linux editor or export templates in the latest Godot release.")

          root = pathlib.Path(".ci/godot")
          root.mkdir(parents=True, exist_ok=True)
          for asset, filename in ((linux_asset, ".ci/godot.zip"), (template_asset, ".ci/templates.tpz")):
              request = urllib.request.Request(asset["browser_download_url"], headers={"User-Agent": "RUblocks-build"})
              with urllib.request.urlopen(request, timeout=180) as response, open(filename, "wb") as output:
                  output.write(response.read())

          with zipfile.ZipFile(".ci/godot.zip") as archive:
              archive.extractall(root)
          executables = list(root.rglob("Godot_*_linux.x86_64"))
          if not executables:
              executables = [p for p in root.rglob("*") if p.is_file() and p.name.lower().startswith("godot") and "linux" in p.name.lower()]
          if not executables:
              raise SystemExit("Godot Linux executable was not found after extracting the release.")
          godot = executables[0]
          godot.chmod(0o755)

          version = release["tag_name"].split("-")[0] + ".stable"
          template_dir = pathlib.Path.home() / ".local/share/godot/export_templates" / version
          template_dir.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(".ci/templates.tpz") as archive:
              archive.extractall(".ci/template_unpack")
          unpack_root = pathlib.Path(".ci/template_unpack")
          source = unpack_root / "templates"
          if not source.is_dir():
              source = unpack_root
          for path in source.iterdir():
              target = template_dir / path.name
              if path.is_dir():
                  shutil.copytree(path, target, dirs_exist_ok=True)
              else:
                  shutil.copy2(path, target)
          with open(".ci/godot_path", "w", encoding="utf-8") as output:
              output.write(str(godot.resolve()))
          print("Using Godot release:", release["tag_name"])
          print("Export templates installed at:", template_dir)
          PY

      - name: Validate scripts and smoke-test startup
        shell: bash
        run: |
          set -euo pipefail
          GODOT_BIN="$(cat .ci/godot_path)"
          "$GODOT_BIN" --version
          mkdir -p .ci/logs

          set +e
          "$GODOT_BIN" --headless --editor --path . --quit > .ci/logs/editor.log 2>&1
          editor_status=$?
          set -e
          cat .ci/logs/editor.log
          if [ "$editor_status" -ne 0 ] || grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' .ci/logs/editor.log; then
            echo "::error::Godot project validation failed."
            exit 1
          fi

          set +e
          "$GODOT_BIN" --headless --path . --quit-after 120 > .ci/logs/runtime.log 2>&1
          runtime_status=$?
          set -e
          cat .ci/logs/runtime.log
          if [ "$runtime_status" -ne 0 ] || grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' .ci/logs/runtime.log; then
            echo "::error::RUblocks startup smoke test failed."
            exit 1
          fi

      - name: Export Windows executable
        shell: bash
        run: |
          mkdir -p artifacts
          GODOT_BIN="$(cat .ci/godot_path)"
          "$GODOT_BIN" --headless --path . --export-release "Windows Desktop" artifacts/RUblocks.exe
          test -s artifacts/RUblocks.exe

      - name: Prepare complete project package
        shell: bash
        run: |
          rm -rf package
          mkdir -p package/Source
          cp artifacts/RUblocks.exe package/RUblocks.exe
          cp project.godot export_presets.cfg README.md package/Source/
          cp -R scenes scripts cloudflare .github assets package/Source/
          cat > package/README_RU.txt <<'TXT'
          RUblocks — Windows EXE + исходники

          RUblocks.exe — собранное Windows-приложение x64.
          Source/project.godot — открой в Godot 4, чтобы редактировать исходники.
          Source/cloudflare/README.md — настройка серверной части.

          Онлайн-регистрация, публикация и сетевой чат требуют, чтобы Cloudflare Worker
          с кодом Source/cloudflare/worker.js был развёрнут и имел привязки D1 DB и
          Durable Objects ROOMS. CI собрал EXE, но не изменяет твой Cloudflare-аккаунт.
          TXT

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: RUblocks-Windows-EXE
          path: artifacts/RUblocks.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload complete package (EXE + source)
        uses: actions/upload-artifact@v4
        with:
          name: RUblocks-Complete-Package
          path: package/**
          if-no-files-found: error
          retention-days: 14

  installer:
    name: Build Windows installer
    needs: export
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows application
        uses: actions/download-artifact@v4
        with:
          name: RUblocks-Windows-EXE
          path: installer-input

      - name: Create Windows icon and install Inno Setup
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bitmap = New-Object System.Drawing.Bitmap(256, 256)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $graphics.TextRenderingHint = [System.Drawing.Text.TextRenderingHint]::AntiAliasGridFit
          $graphics.Clear([System.Drawing.Color]::FromArgb(5, 7, 12))
          $red = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(227, 38, 54))
          $graphics.FillRectangle($red, 18, 18, 220, 220)
          $font = New-Object System.Drawing.Font("Arial", 178, [System.Drawing.FontStyle]::Bold, [System.Drawing.GraphicsUnit]::Pixel)
          $white = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::White)
          $format = New-Object System.Drawing.StringFormat
          $format.Alignment = [System.Drawing.StringAlignment]::Center
          $format.LineAlignment = [System.Drawing.StringAlignment]::Center
          $graphics.DrawString("R", $font, $white, (New-Object System.Drawing.RectangleF(18, 12, 220, 230)), $format)
          $iconHandle = $bitmap.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($iconHandle)
          $stream = [System.IO.File]::Create((Join-Path $PWD "assets/rublocks_icon.ico"))
          $icon.Save($stream)
          $stream.Dispose()
          $icon.Dispose()
          $graphics.Dispose()
          $bitmap.Dispose()
          choco install innosetup --no-progress -y

      - name: Compile RUblocks setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler was not found." }
          & $compiler "installer/RUblocks.iss"
          if (!(Test-Path "artifacts/RUblocks-Setup.exe")) { throw "RUblocks setup executable was not generated." }

      - name: Upload RUblocks installer
        uses: actions/upload-artifact@v4
        with:
          name: RUblocks-Setup-Installer
          path: artifacts/RUblocks-Setup.exe
          if-no-files-found: error
          retention-days: 14
